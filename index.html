<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">

<style>
:root{--bg:#120a24;--pink:#ff2d95;--yel:#ffe14d;--teal:#26e0d0;--ink:#fff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#120a24}}
:root[data-theme="dark"]{--bg:#120a24}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Bungee',Impact,sans-serif;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#wrap{height:100%;display:flex;align-items:center;justify-content:center}
#box{position:relative;width:100%;max-width:900px;aspect-ratio:16/9;max-height:100%}
canvas{width:100%;height:100%;display:block;background:#1b0f3a}
#ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(18,10,36,.82);gap:10px;padding:12px}
h1{margin:0;font-size:clamp(26px,6vw,56px);color:var(--yel);text-shadow:3px 3px 0 var(--pink)}
p{margin:0;font-size:clamp(11px,2vw,16px);color:var(--teal);line-height:1.5}
button,label.b{font:inherit;font-size:clamp(14px,2.6vw,22px);background:var(--pink);color:#fff;border:0;padding:10px 26px;border-radius:8px;cursor:pointer;box-shadow:0 4px 0 #a0125f}
label.b{background:transparent;color:var(--teal);box-shadow:none;border:2px solid var(--teal);font-size:clamp(10px,1.8vw,14px);padding:6px 14px}
button:focus-visible,label.b:focus-within{outline:3px solid var(--yel)}

#rot{display:none;color:var(--yel)}
#pw{font:inherit;font-size:clamp(14px,2.4vw,18px);padding:8px 12px;border-radius:8px;border:2px solid var(--teal);background:#1b0f3a;color:#fff;text-align:center;width:min(70%,260px);-webkit-user-select:text;user-select:text}
#pwerr{color:var(--pink);min-height:1.5em}
#pwhint{color:var(--yel);margin-bottom:8px}
#elf{position:absolute;left:0;top:0;z-index:5;pointer-events:none;background:transparent}
@media (orientation:portrait){#rot{display:block}}
</style></head><body>
<div id="wrap"><div id="box">
<canvas id="c" width="800" height="450"></canvas>
<canvas id="elf" width="800" height="450"></canvas>
<div id="ui">
<h1 id="t">Gangnam Runner</h1>
<p id="msg">Tippen oder Leertaste: springen (Doppelsprung möglich).<br>Sonnenbrillen sammeln, Katze schnappen = unverwundbar!</p>
<p id="rot">Tipp: Handy quer halten, dann ist das Bild größer.</p><div id="pwrow"><p id="pwhint">Tipp: Die besten Karten sind ...?</p><input id="pw" type="password" placeholder="Codewort" autocomplete="off" aria-label="Codewort"><p id="pwerr"></p></div><button id="go">Los geht's</button>

</div></div></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),ui=document.getElementById('ui');
const W=800,H=450,GY=370;
// ===== EINSTELLUNGEN: hier anpassen =====
const CFG={name:'Kumpel',password:'Tarotkarten',remember:false,face:'face.png',secrets:[{at:500,text:'Dafür gibts ne Bowl!'},{at:1000,text:'Das Mondwasser hat geholfen!'}],
elfSays:'Da hast du wohl nicht genug manifestiert?',
quotes:['Hey, sexy Läidi!','Starke Brille!','Oppa!','Zu langsam!','Tanz, tanz, tanz!','Eeeey!'],
crash:['Oppa wäre enttäuscht.','Die Katze ist müde.','Autsch!','Nochmal, Champion!']};
const pick=a=>a[Math.random()*a.length|0];
const faceImg=new Image();let faceOk=false;faceImg.onload=()=>{faceOk=true};faceImg.src=CFG.face;
let st='menu',P,objs,spd,dist,coins,best=0,timer,frame,ride,shake,jumps,pops=[],parts=[],mega=0,horses=0,lvl=0,elev=0,secretDone=0,banner=null,sayT=0;
try{best=+localStorage.getItem('gr-best')||0}catch(e){}
// ---------- Audio ----------
let ac,own=null,step=0,nextT=0,sched=null,mvol=1;function volSet(v){mvol=v;if(own)own.volume=v}
const BPM=132,SP=60/BPM/4;
function tone(f,t,d,type,v){const o=ac.createOscillator(),a=ac.createGain();o.type=type;o.frequency.value=f;a.gain.setValueAtTime(v*mvol,t);a.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(a).connect(ac.destination);o.start(t);o.stop(t+d)}
function noise(t,d,v,hp){const n=ac.sampleRate*d,b=ac.createBuffer(1,n,ac.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=ac.createBufferSource(),a=ac.createGain(),h=ac.createBiquadFilter();h.type='highpass';h.frequency.value=hp;s.buffer=b;a.gain.setValueAtTime(v,t);a.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(h).connect(a).connect(ac.destination);s.start(t)}
const bass=[55,55,0,55,65,0,65,49,55,55,0,55,73,0,65,49],lead=[0,0,440,0,0,523,0,440,0,0,392,0,330,0,392,0];
function sched1(){while(nextT<ac.currentTime+.2){const s=step%16,t=nextT;
if(s%4==0){const o=ac.createOscillator(),a=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);a.gain.setValueAtTime(.7,t);a.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(a).connect(ac.destination);o.start(t);o.stop(t+.2)}
if(s%4==2)noise(t,.05,.25,7000);if(s==4||s==12)noise(t,.12,.35,1500);
if(bass[s])tone(bass[s],t,SP*1.6,'sawtooth',.18);if(lead[s])tone(lead[s],t,SP*1.2,'square',.07);
step++;nextT+=SP}}
// Lieder: MP3-Dateien neben die index.html legen und hier eintragen.
// Bei mehreren Einträgen laufen sie nacheinander. Fehlt die Datei, spielt der eingebaute Beat.
const SONGS=['music.mp3'];let bad=false,idx=0;
function loadSong(){own=new Audio();own.preload='metadata';own.src=SONGS[idx];own.loop=SONGS.length===1;own.addEventListener('error',()=>{bad=true;if(st==='play')music(true)});own.addEventListener('ended',()=>{idx=(idx+1)%SONGS.length;loadSong();music(true)})}
loadSong();
function music(on){
if(own&&!bad){if(on){own.play().catch(()=>{bad=true;music(true)})}else own.pause();return}
if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
if(on){ac.resume();nextT=ac.currentTime+.05;if(!sched)sched=setInterval(sched1,50)}else if(sched){clearInterval(sched);sched=null}}

function sfx(f,d){if(!ac)return;tone(f,ac.currentTime,d,'square',.12)}
// ---------- Game ----------
function reset(){P={x:110,y:GY,vy:0,w:34,h:70};objs=[];spd=5.5;dist=0;coins=0;timer=60;frame=0;ride=0;shake=0;jumps=0;pops=[];parts=[];mega=0;horses=0;lvl=0;elev=0;secretDone=0;CFG.secrets.forEach(s=>{s.done=0});banner=null;sayT=200;volSet(1)}
function jump(){if(st!=='play'){return}if(jumps<2){P.vy=jumps?-12.5:-14.5;jumps++;sfx(jumps>1?660:440,.1);if(Math.random()<.12)say(pick(CFG.quotes))}}
function spawn(){const r=Math.random(),x=W+40;
if(r<.5)objs.push({t:'cone',x,y:GY,w:28,h:40});
else if(r<.75)objs.push({t:'taxi',x,y:GY,w:90,h:44});
else if(r<.87){const n=3+(Math.random()*3|0),h=Math.random()<.5?GY-40:GY-130;for(let i=0;i<n;i++)objs.push({t:'coin',x:x+i*38,y:h-Math.sin(i/(n-1)*Math.PI)*30,w:26,h:14})}
else objs.push({t:Math.random()<.25?'gold':'horse',x,y:GY-90,w:70,h:50,v:Math.random()<.5?0:1})}
function die(){st='over';music(false);volSet(1);elfT=0;if(dist>best){best=Math.floor(dist);try{localStorage.setItem('gr-best',best)}catch(e){}}
document.getElementById('t').textContent='Game Over';
document.getElementById('msg').innerHTML='Strecke: '+Math.floor(dist)+' m &nbsp; Brillen: '+coins+'<br>Rekord: '+best+' m<br>'+CFG.name+', '+pick(CFG.crash);
document.getElementById('go').textContent='Nochmal';ui.style.display='flex'}
function say(t){pops.push({t,x:P.x+20,y:P.y-125,l:90})}
function boom(){for(let i=0;i<70;i++)parts.push({x:P.x+17,y:P.y-60,vx:(Math.random()-.5)*12,vy:-Math.random()*10,c:'hsl('+(Math.random()*360|0)+',90%,60%)',l:70})}
function rainbow(){g.globalAlpha=.6;for(let i=0;i<6;i++){g.fillStyle='hsl('+i*60+',90%,60%)';g.fillRect(P.x-240,P.y-80+i*9,250,9)}g.globalAlpha=1}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y-a.h<b.y&&a.y>b.y-b.h}
function update(){frame++;dist+=spd/20;spd=Math.min(11,5.5+dist/220);
pops.forEach(p=>{p.l--;p.y-=.4});pops=pops.filter(p=>p.l>0);
parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.l--});parts=parts.filter(p=>p.l>0);
if(mega>0)mega--;
const nl=Math.floor(dist/700);if(nl!==lvl){lvl=nl;elev=150;objs=[];volSet(.25);say('Ding! Nächster Stock')}
if(elev>0){elev--;if(!elev)volSet(1)}
for(const s of CFG.secrets)if(!s.done&&dist>=s.at){s.done=1;banner={t:s.text,l:300}}
if(banner&&--banner.l<=0)banner=null;
if(--sayT<=0){say(pick(CFG.quotes));sayT=260+(Math.random()*200|0)}
P.vy+=.75;P.y+=P.vy;if(P.y>=GY){P.y=GY;P.vy=0;jumps=0}
if(ride>0)ride--;if(shake>0)shake--;
timer-=1;if(timer<=0&&!elev){spawn();timer=(55+Math.random()*50)*(5.5/spd)+(Math.random()<.3?40:0)}
for(const o of objs){o.x-=spd;if(o.dead)continue;
if(hit(P,{x:o.x+4,y:o.y,w:o.w-8,h:o.h})){
if(o.t==='coin'){o.dead=1;coins++;sfx(1200,.08)}
else if(o.t==='horse'||o.t==='gold'){o.dead=1;ride=300;horses++;sfx(880,.3);if(o.t==='gold'){mega=300;horses++;boom();say('MEGA-OPPA!!!')}else say('Oppa Gangnam Style!')}
else if(ride>0){o.dead=1;o.fly=1;shake=8;sfx(200,.15);if(Math.random()<.3)say('Eeeey!')}
else die()}}
objs=objs.filter(o=>o.x>-120&&!(o.dead&&o.t!=='cone'&&o.t!=='taxi'))}
// ---------- Draw ----------
const bld=Array.from({length:14},(_,i)=>({x:i*70,w:50+Math.random()*30,h:80+Math.random()*160,s:Math.random()}));
function dancer(x,y,ph){const a=Math.min(1,(300-ride)/25,ride/25);if(a<=0)return;const t=frame*.25+ph*6.28,s=Math.sin(t),bn=Math.abs(s)*3,c=ph>.5?'#26e0d0':'#ffe14d';
g.save();g.globalAlpha=a;g.translate(x,y-bn);g.strokeStyle=c;g.fillStyle=c;g.lineWidth=4;g.lineCap='round';
g.beginPath();g.moveTo(0,-15);g.lineTo(-6+s*7,0);g.moveTo(0,-15);g.lineTo(6+s*7,0);g.moveTo(0,-15);g.lineTo(0,-30);
g.moveTo(0,-27);g.lineTo(11,-38+s*6);g.moveTo(0,-27);g.lineTo(-10,-20-s*4);g.stroke();
g.lineWidth=2;g.beginPath();g.ellipse(14+Math.cos(t*2)*3,-44,9,4,t*2,0,7);g.stroke();
g.beginPath();g.arc(0,-36,6,0,7);g.fill();g.fillStyle='#0a0a14';g.fillRect(-5,-38,10,3);g.restore()}
function floor(a,b){g.fillStyle=a;g.fillRect(0,GY,W,H-GY);g.fillStyle=b;g.fillRect(0,GY,W,3);g.fillStyle='rgba(255,255,255,.35)';for(let x=-((frame*spd)%80);x<W;x+=80)g.fillRect(x,GY+45,40,5)}
function crowd(y){if(ride<=0)return;const n=Math.min(8,horses*2);for(let i=0;i<n;i++)dancer(70+i*95,y-(i%2)*14,i*.17)}
function drawSauna(){const gr=g.createLinearGradient(0,0,0,GY);gr.addColorStop(0,'#4a210c');gr.addColorStop(1,'#b5561a');g.fillStyle=gr;g.fillRect(0,0,W,GY);
g.fillStyle='rgba(0,0,0,.18)';for(let x=0;x<W;x+=40)g.fillRect(x,0,3,GY);
g.fillStyle='#7a3b12';g.fillRect(0,GY-40,W,12);g.fillRect(0,GY-90,W,10);
g.fillStyle='#ffe14d';g.font='22px Impact,sans-serif';g.fillText('SAUNA 90°C',60,60);
crowd(GY-40);
g.fillStyle='rgba(255,255,255,.18)';for(let i=0;i<9;i++){const x=((i*110-frame*spd*.5)%990+990)%990-80,y=GY-((frame*1.2+i*60)%GY);g.beginPath();g.arc(x,y,34,0,7);g.fill()}
floor('#2a1208','#ffb347')}
function drawMetro(){const gr=g.createLinearGradient(0,0,0,GY);gr.addColorStop(0,'#08162a');gr.addColorStop(1,'#1d5d7a');g.fillStyle=gr;g.fillRect(0,0,W,GY);
for(let i=0;i<7;i++){const x=((i*160-frame*spd*.6)%1120+1120)%1120-80;g.fillStyle='#0c2a3f';g.fillRect(x,0,40,GY);g.fillStyle='#ffe14d';g.fillRect(x+5,24,30,12);g.fillStyle='#26e0d0';g.fillRect(x+10,60,20,6)}
g.fillStyle='#fff';g.font='22px Impact,sans-serif';g.fillText('Station Gangnam',300,70);
crowd(GY-30);g.fillStyle='#ffe14d';g.fillRect(0,GY-6,W,6);
floor('#0a0f18','#26e0d0')}
function drawElev(){g.fillStyle='#2b2b3a';g.fillRect(0,0,W,GY);g.fillStyle='#3a3a50';g.fillRect(40,30,W-80,GY-30);g.fillStyle='#8a8aa8';g.fillRect(W/2-3,30,6,GY-30);
g.fillStyle='#000';g.fillRect(W/2-60,10,120,40);g.textAlign='center';g.fillStyle='#ff2d95';g.font='28px Impact,sans-serif';g.fillText((lvl+1)*5+' F',W/2,42);
g.fillStyle='#ffe14d';g.font='18px Impact,sans-serif';g.fillText('♪ Fahrstuhlmusik ♪',W/2,90);g.textAlign='left';
floor('#14141c','#ff2d95')}
function drawBG(){if(elev>0){drawElev();return}const th=lvl%3;if(th===1){drawSauna();return}if(th===2){drawMetro();return}const gr=g.createLinearGradient(0,0,0,GY);gr.addColorStop(0,'#2a1060');gr.addColorStop(1,'#ff2d95');g.fillStyle=gr;g.fillRect(0,0,W,GY);
g.fillStyle='#ffe14d';g.beginPath();g.arc(640,120,50,0,7);g.fill();
for(const b of bld){const x=((b.x-frame*spd*.3)%980+980)%980-80;g.fillStyle='#1a0b3b';g.fillRect(x,GY-b.h,b.w,b.h);
for(let y=GY-b.h+10;y<GY-10;y+=18)for(let k=8;k<b.w-8;k+=14){g.fillStyle=(((x|0)+y+k)*b.s%7)<2.5?'#ffe14d':'#33205e';g.fillRect(x+k,y,6,8)}
if(ride>0){const n=Math.min(horses,3);for(let i=0;i<n;i++)dancer(x+b.w/2+(i-(n-1)/2)*16,GY-b.h,b.s+i*.2)}}
const sx=((900-frame*spd*.6)%1100+1100)%1100-150;g.fillStyle='#26e0d0';g.font='22px Impact,sans-serif';g.fillText('강남 NIGHT',sx,150);
g.fillStyle='#120a24';g.fillRect(0,GY,W,H-GY);g.fillStyle='#26e0d0';g.fillRect(0,GY,W,3);
g.fillStyle='#ffe14d';for(let x=-((frame*spd)%80);x<W;x+=80)g.fillRect(x,GY+45,40,5);crowd(GY+62)}
function drawPlayer(){const{x,y}=P,t=frame*.3,air=y<GY-1,bob=air?0:Math.abs(Math.sin(t))*4;
g.save();g.translate(x+17,y-bob);if(mega>0)g.scale(1.6,1.6);
if(ride>0&&(ride>60||frame%8<4)){g.strokeStyle='#ffe14d';g.lineWidth=4;g.beginPath();g.arc(0,-35,52,0,7);g.stroke()}
g.strokeStyle='#0a0a14';g.lineWidth=9;g.lineCap='round';
const l=ride>0?Math.sin(t*1.6)*12:air?8:Math.sin(t)*14;
g.beginPath();g.moveTo(-6,-30);g.lineTo(-6+l,-2);g.moveTo(6,-30);g.lineTo(6-l,-2);g.stroke();
g.fillStyle='#0a0a14';g.fillRect(-18,-62,36,36);g.fillStyle='#fff';g.fillRect(-5,-62,10,24);
g.fillStyle='#ff2d95';g.fillRect(-8,-60,16,7);
g.strokeStyle='#0a0a14';g.lineWidth=7;g.beginPath();
if(ride>0){const a=Math.sin(t*1.6)*10;g.moveTo(-14,-54);g.lineTo(22,-48+a);g.moveTo(14,-54);g.lineTo(-22+40,-44-a)}else{const a=Math.sin(t)*10;g.moveTo(-16,-54);g.lineTo(-22,-30+a);g.moveTo(16,-54);g.lineTo(22,-30-a)}g.stroke();
if(faceOk){const s=Math.min(faceImg.width,faceImg.height);g.save();g.beginPath();g.arc(10,-119,58,0,7);g.clip();g.drawImage(faceImg,(faceImg.width-s)/2,(faceImg.height-s)/2,s,s,-48,-177,116,116);g.restore();g.lineCap='round';g.lineJoin='round';g.strokeStyle='#000';g.lineWidth=5;g.beginPath();g.moveTo(-33,-177);g.lineTo(-48,-159);g.moveTo(45,-177);g.lineTo(60,-159);g.stroke();for(const lx of[-16,28]){g.beginPath();g.moveTo(lx-17,-177);g.lineTo(lx+17,-177);g.lineTo(lx+13,-158);g.lineTo(lx-13,-158);g.closePath();g.fillStyle='#14141a';g.fill();g.lineWidth=7;g.stroke();g.strokeStyle='rgba(255,255,255,.4)';g.lineWidth=2;g.beginPath();g.moveTo(lx-10,-172);g.lineTo(lx-3,-172);g.stroke();g.strokeStyle='#000'}g.fillStyle='#000';g.fillRect(0,-179,12,7)}else{
g.fillStyle='#f2c9a0';g.beginPath();g.arc(0,-75,15,0,7);g.fill();
g.fillStyle='#0a0a14';g.fillRect(-16,-92,32,10);g.fillRect(-16,-82,6,8);
g.fillRect(-14,-79,28,8);g.fillStyle='#26e0d0';g.fillRect(-12,-77,10,3);g.fillRect(2,-77,10,3)}
g.restore()}
function drawObj(o){g.save();g.translate(o.x,o.y);
if(o.fly){g.translate(0,-30);g.rotate(.6)}
if(o.t==='cone'){g.fillStyle='#ff7a1a';g.beginPath();g.moveTo(0,0);g.lineTo(28,0);g.lineTo(18,-40);g.lineTo(10,-40);g.fill();g.fillStyle='#fff';g.fillRect(7,-22,14,6)}
else if(o.t==='taxi'){g.fillStyle='#ffe14d';g.fillRect(0,-26,90,22);g.fillRect(22,-44,46,20);g.fillStyle='#1a0b3b';g.fillRect(28,-40,16,14);g.fillRect(48,-40,16,14);g.fillStyle='#000';g.beginPath();g.arc(20,-4,9,0,7);g.arc(70,-4,9,0,7);g.fill();g.fillStyle='#ff2d95';g.fillRect(36,-50,18,6)}
else if(o.t==='coin'){g.fillStyle='#0a0a14';g.fillRect(0,-14,26,10);g.fillStyle='#26e0d0';g.fillRect(3,-12,8,3);g.fillRect(15,-12,8,3);g.fillRect(11,-12,4,2)}
else if(o.t==='horse'||o.t==='gold'){const gd=o.t==='gold',c1=o.v?'#2a2a33':'#ff9a2e',K='#1a1020';
const E=(x,y,rx,ry,c)=>{g.fillStyle=c;g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fill();g.stroke()},T=(p,c)=>{g.fillStyle=c;g.beginPath();g.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)g.lineTo(p[i][0],p[i][1]);g.closePath();g.fill();g.stroke()};
if(gd){g.scale(1.3,1.3);g.fillStyle='rgba(255,215,0,.35)';g.beginPath();g.arc(38,-24,48,0,7);g.fill()}
g.lineJoin='round';g.lineCap='round';g.strokeStyle=K;g.lineWidth=9;g.beginPath();g.moveTo(10,-26);g.bezierCurveTo(-8,-28,-9,-10,-3,-6);g.stroke();g.strokeStyle=c1;g.lineWidth=5;g.stroke();
